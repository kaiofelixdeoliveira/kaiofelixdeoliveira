<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Kaio Felix de Oliveira — Tech Lead e Software Architect">
  <title>Kaio Felix de Oliveira — Tech Lead &amp; Software Architect</title>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06172e" />
      <stop offset="48%" stop-color="#0a66c2" />
      <stop offset="100%" stop-color="#6e4aff" />
    </linearGradient>

    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ec5ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8ec5ff" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <path id="p1" d="M726 97 L770 97" />
    <path id="p2" d="M866 97 C 880 97, 880 55, 890 55" />
    <path id="p3" d="M866 97 C 880 97, 880 140, 890 140" />
  </defs>

  <style>
    .name  { font: 700 40px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
    .role  { font: 600 19px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #cfe3ff; }
    .rot   { font: 400 16px 'Fira Code', 'SF Mono', Consolas, monospace; fill: #a8d0ff; opacity: 0; animation: cycle 16s linear infinite; }
    .r2    { animation-delay: 4s; }
    .r3    { animation-delay: 8s; }
    .r4    { animation-delay: 12s; }
    .node  { font: 600 11px 'Segoe UI', Ubuntu, Arial, sans-serif; fill: #dbeafe; }
    .caret { fill: #8ec5ff; animation: blink 1.1s steps(1) infinite; }
    .halo  { animation: breathe 7s ease-in-out infinite; }

    @keyframes cycle {
      0%   { opacity: 0; }
      2%   { opacity: 1; }
      23%  { opacity: 1; }
      25%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes blink   { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes breathe { 0%, 100% { opacity: 0.05; } 50% { opacity: 0.12; } }
  </style>

  <rect width="1000" height="220" rx="14" fill="url(#bg)" />
  <circle class="halo" cx="930" cy="18" r="140" fill="#ffffff" opacity="0.06" />
  <circle class="halo" cx="120" cy="215" r="110" fill="#ffffff" opacity="0.05" />

  <!-- Identidade -->
  <text class="name" x="48" y="82">Kaio Felix de Oliveira</text>
  <rect x="48" y="96" width="300" height="2" fill="url(#rule)" />
  <text class="role" x="48" y="126">Tech Lead &amp; Software Architect</text>

  <g transform="translate(48, 160)">
    <rect class="caret" x="0" y="-12" width="2" height="16" />
    <text class="rot r1" x="12" y="0">Java · Spring Boot · Kafka · RabbitMQ</text>
    <text class="rot r2" x="12" y="0">Arquitetura event-driven em produção</text>
    <text class="rot r3" x="12" y="0">AWS · Azure DevOps · CI/CD</text>
    <text class="rot r4" x="12" y="0">Do backend ao app que o usuário usa</text>
  </g>

  <!-- Motivo: pipeline event-driven -->
  <g opacity="0.95">
    <path d="M726 97 L770 97" stroke="#8ec5ff" stroke-opacity="0.4" stroke-width="1.5" fill="none" />
    <path d="M866 97 C 880 97, 880 55, 890 55" stroke="#8ec5ff" stroke-opacity="0.4" stroke-width="1.5" fill="none" />
    <path d="M866 97 C 880 97, 880 140, 890 140" stroke="#8ec5ff" stroke-opacity="0.4" stroke-width="1.5" fill="none" />

    <rect x="640" y="80" width="86" height="34" rx="9" fill="#ffffff" fill-opacity="0.12" stroke="#cfe3ff" stroke-opacity="0.45" />
    <text class="node" x="683" y="101" text-anchor="middle">API</text>

    <rect x="770" y="80" width="96" height="34" rx="9" fill="#ffffff" fill-opacity="0.18" stroke="#cfe3ff" stroke-opacity="0.6" />
    <text class="node" x="818" y="101" text-anchor="middle">Kafka</text>

    <rect x="890" y="40" width="76" height="30" rx="9" fill="#ffffff" fill-opacity="0.12" stroke="#cfe3ff" stroke-opacity="0.45" />
    <text class="node" x="928" y="59" text-anchor="middle">consumer</text>

    <rect x="890" y="125" width="76" height="30" rx="9" fill="#ffffff" fill-opacity="0.12" stroke="#cfe3ff" stroke-opacity="0.45" />
    <text class="node" x="928" y="144" text-anchor="middle">consumer</text>

    <circle r="3.5" fill="#ffffff" filter="url(#glow)">
      <animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#p1" /></animateMotion>
    </circle>
    <circle r="3.5" fill="#ffffff" filter="url(#glow)">
      <animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#p2" /></animateMotion>
    </circle>
    <circle r="3.5" fill="#ffffff" filter="url(#glow)">
      <animateMotion dur="2.6s" begin="1.6s" repeatCount="indefinite"><mpath href="#p3" /></animateMotion>
    </circle>
  </g>
</svg>
